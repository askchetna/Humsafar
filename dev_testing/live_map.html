<!DOCTYPE html>
<html>

<head>

    <title>Humsafar Live Tracking</title>

    <meta charset="utf-8" />

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <style>

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

    </style>

</head>

<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>

        // =========================================
        // MAP SETUP
        // =========================================

        const map = L.map("map").setView(
            [18.5204, 73.8567],
            13
        );

        // =========================================
        // MAP TILE
        // =========================================

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "Humsafar"
            }
        ).addTo(map);

        // =========================================
        // DRIVER MARKER
        // =========================================

        const driverMarker = L.marker(
            [18.5204, 73.8567]
        ).addTo(map);

        driverMarker.bindPopup(
            "🚖 Driver Online"
        );

        // =========================================
        // SOCKET URL
        // =========================================

        const SOCKET_URL =
            "ws://127.0.0.1:8000/ws/rides/test_ride";

        // =========================================
        // DRIVER SOCKET
        // =========================================

        const driverSocket =
            new WebSocket(SOCKET_URL);

        // =========================================
        // RIDER SOCKET
        // =========================================

        const riderSocket =
            new WebSocket(SOCKET_URL);

        // =========================================
        // DRIVER CONNECTED
        // =========================================

        driverSocket.onopen = () => {

            console.log("🚖 DRIVER CONNECTED");

            let lat = 18.5204;
            let lng = 73.8567;

            // =====================================
            // SIMULATE MOVEMENT
            // =====================================

            setInterval(() => {

                lat += 0.001;
                lng += 0.001;

                const payload = {

                    type: "driver_location",

                    driver_id: "driver_123",

                    lat: lat,

                    lng: lng,

                    status: "online"
                };

                // SEND TO BACKEND

                driverSocket.send(
                    JSON.stringify(payload)
                );

                console.log(
                    "📡 LOCATION SENT:",
                    payload
                );

            }, 3000);

        };

        // =========================================
        // DRIVER EVENTS
        // =========================================

        driverSocket.onmessage = (event) => {

            console.log(
                "🚖 DRIVER SOCKET:",
                event.data
            );

        };

        // =========================================
        // RIDER CONNECTED
        // =========================================

        riderSocket.onopen = () => {

            console.log("🧍 RIDER CONNECTED");

        };

        // =========================================
        // RIDER RECEIVES LIVE LOCATION
        // =========================================

        riderSocket.onmessage = (event) => {

            console.log(
                "🧍 RIDER EVENT RAW:",
                event.data
            );

            const data = JSON.parse(
                event.data
            );

            // =====================================
            // DRIVER LOCATION EVENT
            // =====================================

            if (
                data.type === "driver_location"
            ) {

                const newLatLng = [
                    data.lat,
                    data.lng
                ];

                // MOVE DRIVER MARKER

                driverMarker.setLatLng(
                    newLatLng
                );

                // MOVE MAP CAMERA

                map.panTo(
                    newLatLng
                );

                console.log(
                    "✅ DRIVER MOVED:",
                    newLatLng
                );
            }

        };

        // =========================================
        // SOCKET ERRORS
        // =========================================

        driverSocket.onerror = (error) => {

            console.log(
                "❌ DRIVER SOCKET ERROR:",
                error
            );

        };

        riderSocket.onerror = (error) => {

            console.log(
                "❌ RIDER SOCKET ERROR:",
                error
            );

        };

        // =========================================
        // SOCKET CLOSE
        // =========================================

        driverSocket.onclose = () => {

            console.log(
                "🚖 DRIVER DISCONNECTED"
            );

        };

        riderSocket.onclose = () => {

            console.log(
                "🧍 RIDER DISCONNECTED"
            );

        };

    </script>

</body>

</html>
