<!DOCTYPE html>
<html>

<head>

    <title>Humsafar Live Map</title>

    <meta charset="utf-8" />

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <style>

        body {
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

    </style>

</head>

<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>

        // =====================================
        // CREATE MAP
        // =====================================

        const map = L.map('map').setView(
            [18.5204, 73.8567],
            13
        );



        // =====================================
        // TILE LAYER
        // =====================================

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: 'Humsafar'
            }
        ).addTo(map);



        // =====================================
        // DRIVER MARKER
        // =====================================

        let driverMarker = L.marker(
            [18.5204, 73.8567]
        ).addTo(map);

        driverMarker.bindPopup(
            "Driver Online"
        );



        // =====================================
        // DRIVER SOCKET
        // =====================================

        const socket = new WebSocket(
            "ws://127.0.0.1:8000/ws/drivers/driver_123"
        );



        // =====================================
        // ON CONNECT
        // =====================================

        socket.onopen = () => {

            console.log("DRIVER CONNECTED");

            // SIMULATE DRIVER MOVEMENT

            let lat = 18.5204;
            let lng = 73.8567;

            setInterval(() => {

                lat += 0.0005;
                lng += 0.0005;

                socket.send(

                    JSON.stringify({

                        type: "location_update",

                        driver_id: "driver_123",

                        lat: lat,

                        lng: lng,

                        status: "online"
                    })
                );

                console.log(
                    "LOCATION SENT:",
                    lat,
                    lng
                );

            }, 3000);

        };



        // =====================================
        // RECEIVE REALTIME EVENTS
        // =====================================

        socket.onmessage = (event) => {

            console.log(
                "SOCKET MESSAGE:",
                event.data
            );
        };



        // =====================================
        // RIDER SOCKET
        // =====================================

        const riderSocket = new WebSocket(
            "ws://127.0.0.1:8000/ws/rides/eee31958-e301-4fe3-b02d-a87ed9dfe020"
        );



        // =====================================
        // RECEIVE DRIVER LIVE LOCATION
        // =====================================

        riderSocket.onmessage = (event) => {

            const data = JSON.parse(
                event.data
            );

            console.log(
                "RIDER EVENT:",
                data
            );

            if (data.type === "driver_location") {

                const newLatLng = [
                    data.lat,
                    data.lng
                ];

                // MOVE DRIVER MARKER
                driverMarker.setLatLng(
                    newLatLng
                );

                // MOVE MAP CAMERA
                map.panTo(
                    newLatLng
                );
            }

        };

    </script>

</body>

</html>
